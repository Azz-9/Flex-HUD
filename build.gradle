plugins {
	// see https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml for new versions
	id 'net.fabricmc.fabric-loom' version '1.17.13' apply false
	// see https://projects.neoforged.net/neoforged/moddevgradle for new versions
	id 'net.neoforged.moddev' version '2.0.141' apply false
}

allprojects {
	repositories {
		maven {
			name = "Xaero's Maven"
			url = "https://chocolateminecraft.com/maven"
		}
		maven {
			name = "JourneyMap Maven"
			url = "https://maven.blamejared.com"
		}
		exclusiveContent {
			forRepository {
				maven {
					name = "Modrinth"
					url = "https://api.modrinth.com/maven"
				}
			}
			filter {
				includeGroup "maven.modrinth"
			}
		}
	}
}