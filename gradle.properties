# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
mod_version=1.2-26.2
# stable, beta, alpha
version_type=beta
group=me.Azz_9.flex_hud
java_version=25

# Common
minecraft_version=26.2
mod_name=Flex HUD
mod_author=Azz_9
mod_id=flex_hud
license=MIT
description=Adds a fully customizable HUD system and useful utilities for Minecraft. Whether you're playing survival, building, or PvP, it provides all the information and quality-of-life features you need in one place.
minecraft_compatibility=~26.2
minecraft_version_range=[26.2, 26.3)
minecraft_version_start=26.2
minecraft_version_end=26.2
issues=https://github.com/Azz-9/Flex-HUD/issues
sources=https://github.com/Azz-9/Flex-HUD
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.2-2
# https://maven.fabricmc.net/fabric-loom/fabric-loom.gradle.plugin/maven-metadata.xml
fabric_loom=1.18.2
# https://projects.neoforged.net/neoforged/moddevgradle
neoforged_mod_dev_gradle=2.0.148
# https://modmuss50.github.io/mod-publish-plugin/
publish_plugin_version=2.2.1
# https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
mixin_version=0.17.4+mixin.0.8.7
# https://github.com/LlamaLad7/MixinExtras/releases
mixin_extras_version=0.5.5

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.161.0+26.2
fabric_loader_version=0.19.5

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.2.0.88
neoforge_loader_version_range=[4,)

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# https://maven.terraformersmc.com/releases/com/terraformersmc/modmenu
modmenu_version=20.0.3
launch_with_modmenu=true
# https://chocolateminecraft.com/maven/xaero/minimap/
xaero_minimap_version=26.2:26.5.1
launch_with_xaero_minimap=true
# https://maven.blamejared.com/info/journeymap/journeymap-api-fabric/
journeymap_api_version=26.2-2.0.0
# https://modrinth.com/mod/jade/versions
jade_version=26.2.10
launch_with_jade=true