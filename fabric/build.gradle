plugins {
	id 'multiloader-loader'
	id 'net.fabricmc.fabric-loom-remap'
}

def includeModMenu = project.hasProperty("launch_with_modmenu") && project.launch_with_modmenu.toBoolean()
def includeXaero = project.hasProperty("launch_with_xaero_minimap") && project.launch_with_xaero_minimap.toBoolean()

repositories {
	mavenCentral()
	maven { url = "https://maven.shedaniel.me/" }
	maven {
		name = "Terraformers"
		url = "https://maven.terraformersmc.com/"
	}
}

dependencies {
	minecraft("com.mojang:minecraft:${minecraft_version}")
	mappings loom.layered {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
	}
	modImplementation("net.fabricmc:fabric-loader:${fabric_loader_version}")
	modImplementation("net.fabricmc.fabric-api:fabric-api:${fabric_version}")

	if (includeModMenu) {
		modImplementation("com.terraformersmc:modmenu:${project.modmenu_version}")
	} else {
		modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}")
	}

	if (includeXaero) {
		modImplementation "xaero.minimap:xaerominimap-fabric-${project.xaero_minimap_version}"
	} else {
		modCompileOnly "xaero.minimap:xaerominimap-fabric-${project.xaero_minimap_version}"
	}

	modCompileOnly "info.journeymap:journeymap-api-fabric:${project.journeymap_api_version}"
}

loom {
	def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
	if (aw.exists()) {
		accessWidenerPath.set(aw)
	}
	runs {
		client {
			client()
			setConfigName('Fabric Client')
			ideConfigGenerated(true)
			runDir('runs/client')
		}
	}
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'modCompileClasspath'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'fabric')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'fabric')
			}
		}
	}
}
