plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

neoForge {
	neoFormVersion = neo_form_version
	parchment {
		minecraftVersion = parchment_minecraft
		mappingsVersion = parchment_version
	}
	// Automatically enable AccessTransformers if the file exists
	def at = file('src/main/resources/META-INF/accesstransformer.cfg')
	if (at.exists()) {
		accessTransformers.from(at.absolutePath)
	}

	addModdingDependenciesTo sourceSets.test
}

def includeXaero = project.hasProperty("launch_with_xaero_minimap") && project.launch_with_xaero_minimap.toBoolean()

dependencies {
	// Fabric and NeoForge both bundle Fabric Mixin, so it is safe to use it in common
	// If you need to update, check what version they are using to see what is compatible
	// https://github.com/neoforged/NeoForge/blob/26.2.x/gradle.properties#L37
	// https://github.com/FabricMC/fabric-loader/blob/master/gradle.properties#L12
	compileOnlyApi("net.fabricmc:sponge-mixin:${mixin_version}")
	// Fabric and NeoForge both bundle MixinExtras, so it is safe to use it in common
	compileOnly("io.github.llamalad7:mixinextras-common:${mixin_extras_version}")
	annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}")

	if (includeXaero) {
		implementation "xaero.minimap:xaerominimap-common-${project.xaero_minimap_version}"
	} else {
		compileOnly "xaero.minimap:xaerominimap-common-${project.xaero_minimap_version}"
	}

	compileOnly "info.journeymap:journeymap-api-common:${project.journeymap_api_version}"

	testImplementation platform("org.junit:junit-bom:5.10.2")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava sourceSets.main.java.sourceDirectories.singleFile
	commonResources sourceSets.main.resources.sourceDirectories.singleFile
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements'].each { variant ->
	configurations.named(variant) {
		attributes {
			attribute(loaderAttribute, 'common')
		}
	}
}
sourceSets.configureEach {
	[it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant ->
		configurations.named(variant) {
			attributes {
				attribute(loaderAttribute, 'common')
			}
		}
	}
}

tasks.named('test', Test) {
	useJUnitPlatform()
}